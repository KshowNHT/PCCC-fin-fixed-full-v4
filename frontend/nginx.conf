limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
server {
    listen 80;
    server_name _;
    server_tokens off;
    set_real_ip_from 172.28.76.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26M;
    client_body_timeout 30s;
    limit_req_status 429;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/auth/login {
        limit_req zone=auth_zone burst=5 nodelay;
        include /etc/nginx/pccc-proxy.conf;
    }
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        include /etc/nginx/pccc-proxy.conf;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
