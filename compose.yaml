# Production stack. Public entry: Caddy HTTPS only. Configure .env first.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pccc_db
      POSTGRES_USER: pccc_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pccc_app -d pccc_db']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 1
    networks: [pccc]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pccc_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/pccc_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PCCC_ADMIN_USERNAME: ${PCCC_ADMIN_USERNAME:-admin}
      PCCC_ADMIN_PASSWORD: ${PCCC_ADMIN_PASSWORD:?Set PCCC_ADMIN_PASSWORD}
      PCCC_ALLOWED_ORIGINS: https://${PCCC_DOMAIN:?Set PCCC_DOMAIN}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      MAX_STAFF_ACCOUNTS: ${MAX_STAFF_ACCOUNTS:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.8-flash}
      NODE_ENV: production
      PORT: 3000
      PCCC_DATA_DIR: /app/data
      PCCC_USE_MIGRATIONS: 'true'
    volumes:
      - pccc_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:3000/api/ready']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    cpus: 1.5
    networks: [pccc]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ''
        VITE_ENABLE_CODE_PROTECTION: 'false'
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks: [pccc]

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PCCC_DOMAIN: ${PCCC_DOMAIN:?Set PCCC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    mem_limit: 256m
    cpus: 0.5
    networks: [pccc]

volumes:
  postgres_data:
  pccc_data:
  caddy_data:
  caddy_config:
networks:
  pccc:
    ipam:
      config:
        - subnet: 172.28.76.0/24
