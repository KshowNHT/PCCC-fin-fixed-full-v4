# Ngày 30 kế hoạch: "Deploy hệ thống lên VPS Ubuntu. Cấu hình Reverse Proxy (Nginx) & SSL."
#
# === SECURITY HARDENING (audit \brutal \10x) ===
# - Xoá location /data/ proxy sang backend: backend KHÔNG còn serve file tĩnh
#   qua đường dẫn đó nữa (đã xoá 3 static mount không xác thực khỏi
#   app/main.py — xem SECURITY_AUDIT.md). Giữ route chết vừa vô nghĩa vừa
#   gây hiểu lầm là còn tính năng đó.
# - server_tokens off: ẩn version Nginx khỏi header response (giảm thông tin
#   trinh sát cho kẻ tấn công dò lỗ hổng theo version cụ thể).
# - Thêm security headers ở tầng edge (phòng khi backend lỡ bị truy cập
#   không qua Nginx, ví dụ để lộ port 3000 ra ngoài).
# - Thêm limit_req cho /api/auth/ ở tầng Nginx làm lớp phòng thủ thứ 2, độc
#   lập với rate-limit slowapi ở tầng ứng dụng (defense in depth: dù 1 lớp
#   có bug/bị bypass, lớp còn lại vẫn chặn được).
#
# Với domain thật + SSL: đặt Certbot trực tiếp trên file conf này (bổ sung
# server block :443 với ssl_certificate), hoặc đặt Caddy/Nginx TLS-termination
# ở tầng ngoài rồi proxy_pass vào container này ở cổng 80.

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Giới hạn dung lượng request tại tầng edge (khớp MAX_UPLOAD_SIZE_MB backend)
    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # FIX (rà soát cuối cùng trước bàn giao): CSP trước đây CHỈ được set ở
    # tầng backend (middleware FastAPI trong main.py) — nhưng backend chỉ
    # trả JSON cho các API call, trình duyệt không thực thi CSP trên JSON
    # response theo cách có ý nghĩa bảo mật thật. Trang HTML chính (nơi CSP
    # thực sự cần để chống XSS) lại do CHÍNH NGINX NÀY phục vụ và trước đây
    # KHÔNG có CSP nào — một khoảng trống bảo vệ ở đúng nơi quan trọng nhất.
    # Whitelist Google Fonts vì index.css có @import font từ đó (xác nhận
    # bằng grep trước khi viết dòng này, không đoán mò).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend:3000/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: mọi route không khớp file tĩnh đều trả về index.html
    # để React Router (client-side) tự xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
